# examples/server-block-full.conf
# Complete server block using all snippets in this repo.
# Replace example.com, PHP version, and document root before using.
#
# Assumes:
#   - Certbot/Let's Encrypt certificate
#   - PHP-FPM backend
#   - snippets/ directory at /etc/nginx/snippets/
#   - Rate limiting zone defined in http{} block (see bottom of this file)
#
# NOTE: Update the PHP-FPM socket path (php8.2-fpm.sock) to match whatever PHP version is running on each server before using this.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;

    # ── Certificate ───────────────────────────────────────────────────────────
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # ── TLS config ────────────────────────────────────────────────────────────
    include snippets/ssl-modern.conf;

    # ── Security headers ──────────────────────────────────────────────────────
    include snippets/security-headers.conf;

    # ── Document root ─────────────────────────────────────────────────────────
    root /var/www/example.com/public_html;
    index index.php index.html;

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/example.com.access.log;
    error_log /var/log/nginx/example.com.error.log warn;

    # ── Request limits ────────────────────────────────────────────────────────
    client_max_body_size 32m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # ── Block common attack patterns ──────────────────────────────────────────

    # Dotfiles — .git, .env, .htaccess, etc.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Backup and source files left on the server
    location ~* \.(bak|conf|dist|fla|inc|ini|log|psd|sh|sql|sw[op])$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Main location ─────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM ───────────────────────────────────────────────────────────────
    location ~ \.php$ {
        # Only pass files that actually exist.
        # Prevents nginx from forwarding requests for nonexistent .php files
        # to PHP-FPM, which can lead to path traversal vulnerabilities
        # in some PHP/nginx configurations.
        try_files $uri =404;

        fastcgi_pass unix:/run/php/php8.2-fpm.sock;  # adjust PHP version
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Don't expose PHP errors to clients in production
        fastcgi_param PHP_VALUE "display_errors=0\nerror_reporting=E_ALL";

        fastcgi_read_timeout 300s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
    }

    # ── Static assets ─────────────────────────────────────────────────────────
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|css|js|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";

        # Still apply security headers on static assets
        # (required because include snippets/security-headers.conf in the
        # parent server{} block won't apply inside location{} blocks that
        # define their own add_header directives)
        add_header X-Content-Type-Options "nosniff" always;

        access_log off;
        log_not_found off;
    }

    # ── Let's Encrypt ACME challenge ──────────────────────────────────────────
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        allow all;
    }
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Only allow ACME challenges over HTTP, redirect everything else
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── www → non-www redirect (optional) ────────────────────────────────────────
# Uncomment if you want to canonicalize to the non-www domain.
# Make sure the certificate covers both.
#
# server {
#     listen 443 ssl http2;
#     server_name www.example.com;
#     ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
#     return 301 https://example.com$request_uri;
