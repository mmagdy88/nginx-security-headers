# ── Rate limiting zones (add to http{} block in nginx.conf) ──────────────────
# These can't go in a server{} block — they need to be in the http{} context.
# Add to /etc/nginx/nginx.conf inside the http{} block:
#
#   # General rate limit — 30 requests/second per IP
#   limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
#
#   # Login endpoints — 1 request/second per IP
#   limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;
#
# Then use inside location blocks:
#   limit_req zone=general burst=60 nodelay;
#   limit_req zone=login burst=5 nodelay;
