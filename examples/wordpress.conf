# WordPress-specific nginx security configuration
# Use this instead of the default security-headers.conf for WordPress sites
#
# WordPress requires more permissive CSP than a standard site because:
# - The admin panel loads scripts/styles inline
# - Plugins load resources from arbitrary third-party domains
# - The editor (Gutenberg) uses blob: and data: URIs
#
# This config applies strict headers on the frontend and loosens
# only what's necessary for wp-admin to function.
#
# The add_header inheritance issue in the wp-admin block is real.
# When you define any add_header inside a location block, nginx drops all add_header directives from the parent block for that location.
# That's why the security headers are re-declared inside wp-admin.

server {
    listen 443 ssl http2;
    server_name example.com;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    include snippets/ssl-modern.conf;

    root /var/www/example.com/public_html;
    index index.php;

    # ── Headers applied everywhere ────────────────────────────────────────────

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Permissions policy — adjust if site uses maps, video calls, etc.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ── Frontend CSP (strict) ─────────────────────────────────────────────────
    #
    # Applied to all locations except wp-admin (overridden below).
    # Adjust script-src and style-src based on what your theme/plugins load.
    #
    # Common additions:
    #   Google Fonts:      font-src 'self' https://fonts.gstatic.com;
    #                      style-src 'self' https://fonts.googleapis.com;
    #   Google Analytics:  script-src 'self' https://www.googletagmanager.com;
    #                      connect-src 'self' https://www.google-analytics.com;
    #   reCAPTCHA:         script-src 'self' https://www.google.com https://www.gstatic.com;
    #                      frame-src 'self' https://www.google.com;

    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: https:;
        font-src 'self';
        connect-src 'self';
        frame-src 'none';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
    " always;

    # ── WordPress rewrites ────────────────────────────────────────────────────

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # ── wp-admin — loosen CSP, keep everything else strict ───────────────────
    #
    # Gutenberg and most plugins will break under a strict CSP.
    # 'unsafe-inline' and 'unsafe-eval' are required for the block editor.
    # This is an accepted tradeoff — wp-admin should be behind IP allowlist
    # or HTTP basic auth anyway (see restriction block below).

    location ~* ^/wp-admin {

        # Override the frontend CSP with a permissive admin version
        add_header Content-Security-Policy "
            default-src 'self';
            script-src 'self' 'unsafe-inline' 'unsafe-eval';
            style-src 'self' 'unsafe-inline';
            img-src 'self' data: https:;
            font-src 'self' data:;
            connect-src 'self';
            frame-src 'self';
            object-src 'none';
        " always;

        # Re-declare the other headers — nginx doesn't inherit add_header
        # from parent blocks when you add any header in a child block.
        # See: https://nginx.org/en/docs/http/ngx_http_headers_module.html
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # ── Optional: restrict wp-admin by IP ────────────────────────────────
        # Uncomment and set your IP. Most practical protection against
        # credential stuffing on the login page.
        #
        # allow 1.2.3.4;      # your office/home IP
        # deny all;

        try_files $uri $uri/ /index.php?$args;
    }

    # ── wp-login.php — rate limiting ─────────────────────────────────────────
    #
    # Define the zone in your http{} block in nginx.conf:
    #   limit_req_zone $binary_remote_addr zone=wplogin:10m rate=1r/s;

    location = /wp-login.php {
        limit_req zone=wplogin burst=3 nodelay;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }

    # ── Block access to sensitive files ──────────────────────────────────────

    # No reason for these to be publicly accessible
    location ~* ^/(wp-config\.php|wp-config-sample\.php|readme\.html|license\.txt|xmlrpc\.php) {
        deny all;
    }

    # Block direct PHP execution in uploads — common webshell vector
    location ~* /wp-content/uploads/.*\.php$ {
        deny all;
    }

    # Block dotfiles (.htaccess, .git, .env, etc.)
    location ~ /\. {
        deny all;
    }

    # ── PHP-FPM ───────────────────────────────────────────────────────────────

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Don't let PHP process requests for files that don't exist
        # Prevents a class of vulnerabilities in older PHP/nginx combos
        try_files $uri =404;
    }

    # ── Static assets ─────────────────────────────────────────────────────────

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name example.com;
    return 301 https://$host$request_uri;
}