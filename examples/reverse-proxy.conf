# examples/reverse-proxy.conf
# nginx as a reverse proxy in front of another application server.
# Common setups this covers:
#   - nginx → Node.js / Python (Gunicorn, uvicorn) / Ruby (Puma)
#   - nginx → Apache (when running both on the same server)
#   - nginx → Docker container exposing a port
#   - nginx → another internal service on a different host
#
# Replace example.com and the proxy_pass address before using.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    # ── Certificate ───────────────────────────────────────────────────────────
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # ── TLS + security headers ────────────────────────────────────────────────
    include snippets/ssl-modern.conf;
    include snippets/security-headers.conf;

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/example.com.access.log;
    error_log /var/log/nginx/example.com.error.log warn;

    # ── Request size limit ────────────────────────────────────────────────────
    # Increase for apps that accept file uploads.
    client_max_body_size 32m;

    # ── Block dotfiles ────────────────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Proxy to backend ──────────────────────────────────────────────────────
    location / {
        # Backend address — examples:
        #   Local port:        http://127.0.0.1:3000
        #   Unix socket:       http://unix:/run/app/app.sock
        #   Docker container:  http://172.17.0.2:8080
        #   Internal host:     http://10.0.0.5:8080
        proxy_pass http://127.0.0.1:3000;

        # ── Strip backend info headers ─────────────────────────────────────
        include snippets/proxy-hide.conf;

        # ── WebSocket support ──────────────────────────────────────────────
        # Required for apps using WebSockets (Socket.IO, ActionCable, etc.)
        # Safe to leave in even for non-WebSocket apps — has no effect.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # ── Timeouts ───────────────────────────────────────────────────────
        # Defined in proxy-hide.conf. Override here if this specific location
        # has long-running requests (file processing, report generation, etc.)
        # proxy_read_timeout 300s;
    }

    # ── Serve static files directly from nginx ────────────────────────────────
    # Offloads static file serving from the backend.
    # Adjust the path to wherever your app stores compiled/public assets.
    location /static/ {
        alias /var/www/example.com/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location /media/ {
        alias /var/www/example.com/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # ── Health check endpoint ─────────────────────────────────────────────────
    # Bypass auth/rate-limiting for internal health checks (load balancer, etc.)
    location = /health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;     # internal network — adjust to your range
        deny all;
    }

    # ── Let's Encrypt ACME challenge ──────────────────────────────────────────
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        allow all;
    }
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── WebSocket upgrade map (add to http{} block in nginx.conf) ─────────────────
# Required for the WebSocket proxy_set_header Connection directive above.
# Add to /etc/nginx/nginx.conf inside the http{} block:
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
#
# This maps: if the client sends an Upgrade header, pass "upgrade" to the backend.
# If not, pass "close". Without this map, the variable $connection_upgrade
# used above will be undefined and nginx will fail to start.

# ── nginx → Apache on the same server ────────────────────────────────────────
# If Apache is running on port 8080 (with Listen 8080 in apache.conf):
#
#   proxy_pass http://127.0.0.1:8080;
#
# Make sure Apache isn't bound to 0.0.0.0:8080 — bind it to 127.0.0.1:8080
# so it's not directly reachable, only through nginx:
#
#   Listen 127.0.0.1:8080
#
# Also disable the Apache Server header from being passed through:
# proxy-hide.conf already handles this with proxy_hide_header Server;

# ── nginx → Docker container ──────────────────────────────────────────────────
# Find the container IP:
#   docker inspect <container_name> | grep IPAddress
#
# Or use the container name if nginx is also in Docker on the same network:
#   proxy_pass http://container_name:8080;
#
# For production, use a named Docker network instead of relying on
# default bridge IPs which change on container restart.
