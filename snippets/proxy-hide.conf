# snippets/proxy-hide.conf
# Strip backend information from proxied responses.
# Use when nginx sits in front of another application server (Apache, Node,
# PHP-FPM via another nginx, Gunicorn, etc.)
#
# Include inside a location{} block or server{} block that uses proxy_pass:
#   include snippets/proxy-hide.conf;
#
# These headers tell attackers what's running behind nginx. Removing them
# doesn't stop a determined attacker but removes easy wins for automated
# scanners that look for version-specific vulnerabilities.

# ── Application framework headers ─────────────────────────────────────────────

# PHP version — sent by PHP-FPM by default
# e.g. X-Powered-By: PHP/8.2.12
proxy_hide_header X-Powered-By;

# ASP.NET version
# e.g. X-AspNet-Version: 4.0.30319
proxy_hide_header X-AspNet-Version;

# ASP.NET MVC version
proxy_hide_header X-AspNetMvc-Version;

# ── Server/runtime headers ────────────────────────────────────────────────────

# Apache server header (when proxying behind Apache)
# e.g. Server: Apache/2.4.54 (Ubuntu)
# nginx replaces this with its own Server header by default.
# server_tokens off in security-headers.conf handles the nginx one.
proxy_hide_header Server;

# Runtime environments
proxy_hide_header X-Runtime;        # Rails — response time in seconds
proxy_hide_header X-Version;        # Various frameworks

# ── Infrastructure headers ────────────────────────────────────────────────────

# Internal request IDs — sometimes leak internal hostnames or UUIDs
# that reveal infrastructure details. Remove if not needed by the client.
# Comment out if your monitoring/tracing depends on these.
proxy_hide_header X-Request-Id;
proxy_hide_header X-Correlation-Id;

# Generator tags from CMSes
# e.g. X-Generator: Drupal 10 (https://www.drupal.org)
proxy_hide_header X-Generator;

# ── Debug headers — never expose in production ────────────────────────────────
# These occasionally leak from dev configs or misconfigured apps.
# Hiding them here as a safety net.
proxy_hide_header X-Debug-Token;
proxy_hide_header X-Debug-Token-Link;  # Symfony profiler
proxy_hide_header X-Forwarded-Server;

# ── Cache backend headers ─────────────────────────────────────────────────────
# Varnish and other cache backends often expose internal state.
# Remove before sending to clients unless you need them for debugging.
#
# Comment these out if you need them for cache debugging:
proxy_hide_header X-Varnish;
proxy_hide_header Via;
proxy_hide_header X-Cache;
proxy_hide_header X-Cache-Hits;

# ── Pass real client IP to backend ────────────────────────────────────────────
# These aren't about hiding — they ensure the backend sees the real client IP
# instead of nginx's IP. Required if the backend logs or rate-limits by IP.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Host $host;

# ── Timeouts ──────────────────────────────────────────────────────────────────
# Reasonable defaults for most setups. Increase connect_timeout if the
# backend is on a slow network path. Increase read_timeout for long-running
# requests (file uploads, report generation, etc.)
proxy_connect_timeout 10s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;

# Buffer the response from the backend.
# Prevents slow clients from holding backend connections open.
proxy_buffering on;
proxy_buffer_size 4k;
proxy_buffers 8 4k;
