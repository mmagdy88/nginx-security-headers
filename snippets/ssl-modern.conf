# snippets/ssl-modern.conf
# TLS configuration for modern nginx (1.18+)
# Targets TLS 1.2 and 1.3 only. Drops TLS 1.0 and 1.1.
#
# Include in your server block alongside the certificate directives:
#   ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
#   ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
#   include snippets/ssl-modern.conf;
#
# Test result at: https://www.ssllabs.com/ssltest/
# Target: A or A+

# ── Protocol versions ─────────────────────────────────────────────────────────
# TLS 1.0 and 1.1 are deprecated (RFC 8996) and disabled by default in modern
# browsers. There's no reason to support them on a new server.
ssl_protocols TLSv1.2 TLSv1.3;

# ── Cipher suites ─────────────────────────────────────────────────────────────
# ECDHE ciphers provide forward secrecy — if the server's private key is
# compromised later, past sessions can't be decrypted.
# GCM and CHACHA20-POLY1305 are AEAD ciphers (authenticated encryption).
# This list comes from Mozilla's modern compatibility profile.
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

# ── Cipher preference ─────────────────────────────────────────────────────────
# 'off' means let the client choose from the allowlist above.
# Modern clients will negotiate TLS 1.3 automatically — the cipher list
# above only applies to TLS 1.2 connections.
# 'on' used to be recommended to prioritize server-side AES-NI acceleration,
# but this is no longer necessary on modern hardware.
ssl_prefer_server_ciphers off;

# ── OCSP stapling ─────────────────────────────────────────────────────────────
# Normally, during TLS handshake, the browser contacts the CA to check if
# your certificate is revoked. This adds latency and leaks user activity to the CA.
# OCSP stapling: nginx fetches the CA's response itself and includes it in
# the handshake. Faster for users, no CA contact from the client.
ssl_stapling on;
ssl_stapling_verify on;

# Resolver for OCSP lookups. Use your own resolver if you have one.
# valid=300s caches the DNS result for 5 minutes.
resolver 1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout 5s;

# ── DH parameters ─────────────────────────────────────────────────────────────
# Only needed for TLS 1.2 DHE cipher suites, which aren't in this cipher list.
# Included here for setups that need broader client compatibility.
# Generate with: openssl dhparam -out /etc/nginx/dhparam.pem 2048
# 4096 bits is overkill and noticeably slows handshakes — 2048 is fine.
#
# Uncomment if needed:
# ssl_dhparam /etc/nginx/dhparam.pem;

# ── Session cache ─────────────────────────────────────────────────────────────
# Caches TLS session parameters so returning clients skip the full handshake.
# shared:SSL:10m — shared across all worker processes, 10MB.
# 1MB holds roughly 4000 sessions.
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;

# ── Session tickets ───────────────────────────────────────────────────────────
# Session tickets are an alternative to session cache for resumption.
# Disabled here because nginx doesn't rotate the ticket encryption key
# automatically — using static ticket keys breaks forward secrecy for
# resumed sessions. Unless you're managing key rotation yourself, leave this off.
ssl_session_tickets off;

# ── HSTS (preload-ready) ──────────────────────────────────────────────────────
# Defined here as a reminder that it pairs with the TLS config.
# Actually applied in security-headers.conf to keep header management in one place.
#
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
