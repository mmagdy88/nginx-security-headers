# snippets/security-headers.conf
# Core security headers — include this in every server block:
#   include snippets/security-headers.conf;
#
#     If you add any add_header directive inside a location{} block,
#     nginx drops all headers inherited from parent blocks for that location.
#     You'll need to re-declare these headers inside any location{} block
#     that defines its own add_header. See examples/wordpress.conf for how
#     this is handled in practice.

# ── Prevent MIME-type sniffing ────────────────────────────────────────────────
# Stops browsers from executing a file as a different type than declared.
# Example attack: serve a .txt file containing JavaScript — without this,
# some browsers will execute it.
add_header X-Content-Type-Options "nosniff" always;

# ── Clickjacking protection ───────────────────────────────────────────────────
# SAMEORIGIN: only your own domain can embed this page in an iframe.
# DENY: nobody can, including your own pages.
# Use DENY unless you have a specific need to iframe your own pages.
add_header X-Frame-Options "SAMEORIGIN" always;

# ── XSS filter (legacy browsers) ─────────────────────────────────────────────
# Modern browsers ignore this in favor of CSP. Still worth setting for
# older browsers that don't support CSP.
add_header X-XSS-Protection "1; mode=block" always;

# ── HSTS — force HTTPS ────────────────────────────────────────────────────────
# Once a browser sees this header it will refuse to connect over HTTP
# for max-age seconds (1 year here), even if the user types http://.
#
#     Only enable after HTTPS is confirmed working on all subdomains.
#     This is cached by the browser and can't be easily undone.
#     Don't add 'preload' until you're certain — preload list removal
#     takes months and requires max-age of at least 1 year.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# ── Referrer policy ───────────────────────────────────────────────────────────
# Controls what URL is sent in the Referer header when users follow links.
# no-referrer-when-downgrade: send full URL to HTTPS destinations,
# nothing when going HTTPS → HTTP (no point leaking URLs to unencrypted destinations).
#
# Tighten to 'same-origin' or 'no-referrer' for apps with sensitive data in URLs.
add_header Referrer-Policy "no-referrer-when-downgrade" always;

# ── Permissions policy ────────────────────────────────────────────────────────
# Disables browser features the site doesn't use.
# Empty () means denied for all origins including your own.
# This limits the blast radius of a compromised third-party script —
# a poisoned analytics library can't silently activate the microphone.
#
# Adjust if your site legitimately needs any of these:
#   geolocation=(self)       — your origin only
#   geolocation=(*)          — all origins (don't do this)
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

# ── Content Security Policy ───────────────────────────────────────────────────
# Tells the browser exactly where it's allowed to load resources from.
# This is the most powerful XSS mitigation available.
#
# This default policy is strict and WILL break most sites on first apply.
# Use Report-Only mode first to see what would be blocked:
#   Content-Security-Policy-Report-Only: <same policy>
#
# Common additions needed:
#   Google Fonts:        font-src 'self' https://fonts.gstatic.com;
#                        style-src 'self' https://fonts.googleapis.com 'unsafe-inline';
#   Google Analytics:    script-src 'self' https://www.googletagmanager.com;
#                        connect-src 'self' https://www.google-analytics.com;
#   CDN assets:          script-src 'self' https://cdnjs.cloudflare.com;
#   Inline styles only:  style-src 'self' 'unsafe-inline';   ← acceptable tradeoff
#   Inline scripts:      script-src 'self' 'unsafe-inline';  ← avoid if at all possible
#
# 'unsafe-eval' is required by some JS frameworks (older Angular, some Vue configs).
# Avoid it — it allows eval() which is a direct XSS vector.
#
# frame-ancestors replaces X-Frame-Options and is more flexible.
# Both are set here for browser compatibility.
add_header Content-Security-Policy "
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: https:;
    font-src 'self';
    connect-src 'self';
    frame-src 'none';
    object-src 'none';
    base-uri 'self';
    form-action 'self';
    frame-ancestors 'none';
" always;

# ── Server token suppression ──────────────────────────────────────────────────
# Removes nginx version from error pages and the Server response header.
# Goes from: Server: nginx/1.24.0
# To:        Server: nginx
#
# Not a meaningful security control on its own — version fingerprinting
# is possible through other means. But it removes easy wins for automated
# scanners looking for version-specific exploits.
#
# To remove the Server header entirely you need the ngx_headers_more module:
#   more_clear_headers 'Server';
# That module isn't in default Ubuntu/Debian packages.
# See: https://github.com/openresty/headers-more-nginx-module
server_tokens off;
